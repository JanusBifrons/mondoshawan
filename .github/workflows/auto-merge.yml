name: Auto-merge

# Turns on GitHub auto-merge for every PR into main as soon as it's opened.
# Auto-merge waits for the required "verify" check (branch protection on main), then
# merges with a merge commit. Draft PRs are skipped until they're marked ready.
# To keep a PR open, mark it draft or run `gh pr merge <n> --disable-auto`.
#
# The repo's "delete branch on merge" setting doesn't fire when the merge was made by
# auto-merge that this workflow (the Actions bot) enabled, so the `cleanup` job deletes
# the merged branch itself.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: >-
      github.event.action != 'closed' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout: this job only calls the GitHub API, so PR code never runs with these permissions.
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --merge

  cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete the merged branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        # Already deleted (e.g. by the repo setting) is fine.
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCH" || echo "branch $BRANCH already gone"
